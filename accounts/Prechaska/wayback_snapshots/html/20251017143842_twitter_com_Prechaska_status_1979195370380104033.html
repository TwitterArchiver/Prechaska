  （1/?）视力下降的可能原因，闭角型青光眼（ACG）——瞳孔散大、眼压升高的危险：
  <br/>
  由于房角闭合导致眼压升高由此损害视神经导致ACG，而引起闭角最常见的机制是瞳孔阻滞，即在瞳孔水平上房水排出受阻，使得房水积聚眼压升高从而引发ACG。因此药源性的瞳孔散大就会最终增加ACG发生的可能。
