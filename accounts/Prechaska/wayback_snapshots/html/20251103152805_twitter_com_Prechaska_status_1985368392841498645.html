  啊，觉得一个东西好吃并不是因为它本身的味道，而是伏隔核释放多巴胺，令大脑赋予了该味觉“好吃”这一评价，所以这从来就是情绪的边缘回路所致，而不是它本来如此。也因此多巴胺耗尽后，味觉也会丧失，不是丧失掉尝出味道的能力，而是品尝出一个东西“好吃”的能力。
